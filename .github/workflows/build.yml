# Build & publish — pushes runnable images to GHCR (SPEC §Session 6).
# Correctness is CI's job (ci.yml); this workflow only packages what already
# landed on main, so require the CI check in branch protection.
#
# Each platform is built natively on its own runner and pushed by digest; the
# merge job then stitches the digests into one multi-arch manifest and attaches
# the human-readable tags. Native arm64 runners keep the Maven build off QEMU.
name: Build & publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Publishing is not cancelled mid-flight — a half-pushed tag helps nobody.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.module }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        module: [taskhub-api, notification-service]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          # Free for public repositories — no emulation.
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v5

      # Artifact names cannot contain '/', so linux/amd64 -> linux-amd64.
      - name: Derive platform slug
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_SLUG=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Repository-scoped token; no PAT needed for a package under this repo.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.module }}/Dockerfile
          platforms: ${{ matrix.platform }}
          # No tags here: this leg publishes an untagged, digest-addressed image.
          outputs: type=image,name=ghcr.io/${{ github.repository }}/${{ matrix.module }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.module }}-${{ env.PLATFORM_SLUG }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}-${{ env.PLATFORM_SLUG }}

      # The digest is handed to the merge job as an (empty) file named after it.
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.module }}-${{ env.PLATFORM_SLUG }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        module: [taskhub-api, notification-service]

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.module }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main   -> sha-<short> + latest
      # v1.2.3 -> sha-<short> + 1.2.3 + 1.2
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.module }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create and push the multi-arch manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.module }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect published platforms
        env:
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.module }}
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"
