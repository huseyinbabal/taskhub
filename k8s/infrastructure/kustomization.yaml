apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Cluster-wide prerequisites, reconciled by the `infrastructure` Flux
# Kustomization. The `apps` Kustomization dependsOn it, so the CRDs and chart
# sources are always in place before any app manifest is applied.
resources:
  - helm-repositories.yaml
  - cloudnative-pg.yaml
  - monitoring.yaml
