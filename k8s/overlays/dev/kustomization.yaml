apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: taskhub-dev

resources:
  - namespace.yaml
  - ../../base

# Single replicas, small requests, one Postgres instance — a laptop-sized
# cluster. The prod overlay is where this grows.
patches:
  - path: replicas-and-resources.yaml
    target:
      kind: Deployment
  - path: postgres-dev.yaml

# Non-secret configuration. Note postgres-rw: CloudNativePG points that service
# at the current primary.
configMapGenerator:
  - name: taskhub-config
    literals:
      - JDBC_DATABASE_URL=jdbc:postgresql://postgres-rw:5432/taskhub
      - TASKHUB_HAZELCAST_ADDRESS=hazelcast:5701
      - TASKHUB_HAZELCAST_CLUSTER=taskhub
      - TASKHUB_NOTIFICATIONS_TARGET=static://notification-service:9090
      - TASKHUB_CORS_ALLOWED_ORIGINS=http://localhost:3000

# Dev-only values, deliberately the same throwaway secret application-dev.yml
# already carries in Git. Prod supplies its own out of band — see overlays/prod.
secretGenerator:
  - name: taskhub-secrets
    literals:
      - TASKHUB_JWT_SECRET=dev-only-insecure-secret-change-me-32bytes!!
  - name: taskhub-db-credentials
    type: kubernetes.io/basic-auth
    literals:
      - username=taskhub
      - password=dev-only-insecure-password

# Hashed names would force a new Secret name on every edit, which CloudNativePG
# (holding a static reference to taskhub-db-credentials) cannot follow.
generatorOptions:
  disableNameSuffixHash: true
