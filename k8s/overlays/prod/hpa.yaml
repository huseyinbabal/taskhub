# Prod-only. Requires metrics-server; without it the HPA reports unknown
# metrics and simply holds the floor of 2 replicas.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: taskhub-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: taskhub-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
