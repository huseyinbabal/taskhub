# Postgres as a CloudNativePG `Cluster` — the operator owns the StatefulSet,
# PVCs, failover and the connection services. We only declare intent.
#
# The operator creates three services; taskhub-api talks to the primary:
#   postgres-rw  -> primary (read/write)
#   postgres-ro  -> replicas (read-only)
#   postgres-r   -> any instance
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 1
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: taskhub
      owner: taskhub
      # Owner credentials come from our own Secret rather than a generated one,
      # so taskhub-api can read the very same keys.
      secret:
        name: taskhub-db-credentials
  # The operator creates a PodMonitor for its own exporter (:9187), which is what
  # feeds the community CloudNativePG dashboard (SPEC §Session 8).
  monitoring:
    enablePodMonitor: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
