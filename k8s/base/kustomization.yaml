apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Environment-agnostic definitions. Namespace, replica counts, resources,
# config values and secrets all come from the overlays — nothing here is
# meant to be applied directly.
resources:
  - postgres.yaml
  - hazelcast.yaml
  - taskhub-api.yaml
  - notification-service.yaml
  # Observability (SPEC §Session 8). The CRDs behind the first two come from
  # kube-prometheus-stack in k8s/infrastructure, which `apps` dependsOn.
  - servicemonitors.yaml
  - alerts.yaml
  - dashboard.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: taskhub
    includeSelectors: false

# Immutable tags on purpose: `latest` moves under the cluster's feet and makes
# "which commit is running?" unanswerable. Bumping these two lines is how an
# image update reaches the cluster — and reverting that commit is the rollback.
images:
  - name: ghcr.io/huseyinbabal/taskhub/taskhub-api
    newTag: sha-7d47267
  - name: ghcr.io/huseyinbabal/taskhub/notification-service
    newTag: sha-7d47267
